# Example configuration
#
# Copy this file to config.yaml and customize for your environment.
#
# Required environment variables:
#   SF_TOKEN    - API authentication token
#   SF_APP_URL  - API base URL (e.g., https://api.example.com)
#
# For multi-instance support, use --env-prefix flag:
#   RUN1__SF_TOKEN, RUN1__SF_APP_URL for --env-prefix=RUN1__
#   RUN2__SF_TOKEN, RUN2__SF_APP_URL for --env-prefix=RUN2__

project:
  # Project name (required)
  name: "my-web-scan"

  # One-time scan flag
  # true = each scanner runs once and scan stops when all tasks are completed
  # false = continuous scanning
  # При переиспользовании проекта (reuse_existing_project) рекомендуется one_time: false.
  one_time: true

  # Scan priority (-1 to 3, where 3 - max priority)
  priority: 3

  # Scan agent identifier (qtag). Empty string = use the default agent.
  scan_agent: ""

  # Requests per second limit for the scan (min 30, max 10000).
  # Optional: leave it commented out to disable the limit — when unset,
  # rps is NOT sent to the API and the scanner uses its own default rate.
  # rps: 1000


  # Несовместимо с reuse_existing_project
  delete_on_completion: false   # удалить проект после успешного скана (только при SUCCESS).
  # Несовместимо с reuse_existing_project
  datetime_name_postfix: false  # добавить дату/время (UTC) к имени проекта.

  reuse_existing_project: false # искать проект по имени и переиспользовать.
  # Если найден — рескан проекта.
  # если нет — создаётся. На каждом запуске scan_settings/scope re-PATCH.
  # Несовместимо с delete/postfix. Рекомендуется one_time: false

target: "example.com"

# Headers for target application authorization
# Each header value is a list of strings
webauth:
  Host:
    - "example.com"
  Authorization:
    - "Bearer eyJhbGci..."
  Cookie:
    - "session=abc123; csrf_token=xyz789"
    - "env::ENV_VARIABLE_NAME"
  # Add any other headers your application requires
  # Content-Type:
  #   - "application/json"
  #   - "env::AUTH_COOKIE"

monitoring:
  # URL to check if authorization is still valid
  # Must return HTTP 200 when auth is valid
  health_check_url: "https://example.com/api/auth/check"
  health_check_allowed_http_codes:
    - 200
    - 204

  # Verify TLS certificate of the health check URL (default: true).
  # Set to false only for targets with self-signed or expired certificates
  # (internal test stands, staging, etc.).
  verify_ssl: true

  # How often to check authorization (1-60 minutes)
  check_interval_minutes: 5

  # Retries for the health check on TRANSIENT network/TLS errors (timeouts,
  # handshake errors). The scan is stopped only after all
  # retries fail.
  health_check_retries: 2
  health_check_retry_delay_seconds: 5

  # Maximum scan runtime in hours (max 240 = 10 days)
  # Scan will stop after this time even if not completed
  max_runtime_hours: 24

# Reports downloaded from SF after the scan finishes.
# Useful for publishing as GitLab CI/CD artifacts.
report:
  language: "ru"            # язык PDF/HTML отчёта en/ru
  severity: [10, 8, 5]      # применяется ко всем форматам; допустимо: 2,3,5,8,10
  pdf:
    enabled: true
    output_path: "./report.pdf"
  html:
    enabled: false
    output_path: "./report.html"
  alerts_json:
    enabled: false
    output_path: "./alerts.json"
  alerts_grouped_json:
    enabled: false
    output_path: "./alerts-grouped.json"
